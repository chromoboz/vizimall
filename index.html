<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>VIZIMALL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css?v=40" />
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-main">VIZIMALL</span>
      <span class="brand-sub">A WORLD TO EXPLORE</span>
    </div>
  </header>


  <main class="page-shell">

    <section class="panorama-section">

      <div class="intro-copy">
        <h1>Walk in. Look around.</h1>
        <p>Drag the mall left and right to explore.</p>
      </div>


      <div
        class="panorama-viewport"
        id="panoramaViewport"
        aria-label="Draggable mall panorama"
      >

        <div class="panorama-track" id="panoramaTrack">

          <div class="panorama-canvas">

            <img
              id="panoramaImage"
              class="panorama-image"
              src="./vizimall-panorama.png"
              alt="Vizimall panoramic shopping mall interior"
              draggable="false"
            />


            <button
              class="store-hotspot home-hotspot"
              data-store="HOME & LIVING"
              aria-label="Home and Living">
            </button>


            <button
              class="store-hotspot beauty-hotspot"
              data-store="BEAUTY & CARE"
              aria-label="Beauty and Care">
            </button>


            <button
              class="store-hotspot tech-hotspot"
              data-store="TECH & GADGETS"
              aria-label="Tech and Gadgets">
            </button>


            <button
              class="store-hotspot travel-hotspot"
              data-store="TRAVEL & EXPLORE"
              aria-label="Travel and Explore">
            </button>


            <button
              class="store-hotspot auto-hotspot"
              data-store="AUTO ESSENTIALS"
              aria-label="Auto Essentials">
            </button>


            <button
              class="store-hotspot pets-hotspot"
              data-store="PETS & FRIENDS"
              aria-label="Pets and Friends">
            </button>


            <button
              class="store-hotspot stairs-hotspot"
              data-store="UPSTAIRS"
              aria-label="Upstairs">
            </button>

          </div>

        </div>


        <div class="panorama-fade panorama-fade-left"></div>
        <div class="panorama-fade panorama-fade-right"></div>


        <div class="store-indicator" id="storeIndicator">
          <span id="storeIndicatorText">Explore VIZIMALL</span>
        </div>

      </div>


      <div class="drag-hint">
        <span>←</span>
        <span>Drag / Swipe to explore</span>
        <span>→</span>
      </div>


      <div class="panorama-progress">
        <div
          class="panorama-progress-bar"
          id="progressBar">
        </div>
      </div>

    </section>

  </main>


  <script src="script.js?v=30"></script>

</body>
</html>
